id = "pang/tide-sidebar"
name = "侧边栏工作台"
version = "2.3.0"
plugin_api = 42
author = "pang"
license = "MIT"
description = "窄标签侧栏：可恢复便签、计算器、自由倒计时、秒表、rice-hotspot 热点和 niri 窗口管理。"
icon = "layout-sidebar-left-expand"
tags = ["panel", "utility", "productivity", "service"]
dependencies = ["python", "niri", "networkmanager", "gjs", "gtk4", "gtk4-layer-shell"]

# 插件级设置：在 设置 → 插件（插件行上的齿轮）里编辑，所有 entry 都能用
# noctalia.getConfig(key) 读到；未声明的键会报警告并返回 nil。

[[setting]]
key = "reduced_motion"
type = "bool"
label_key = "settings.reduced_motion.label"
description_key = "settings.reduced_motion.description"
default = false

[[setting]]
key = "panel_width"
type = "int"
label_key = "settings.panel_width.label"
description_key = "settings.panel_width.description"
default = 450
min = 380
max = 640

[[setting]]
key = "remember_last_tab"
type = "bool"
label_key = "settings.remember_last_tab.label"
description_key = "settings.remember_last_tab.description"
default = true

[[setting]]
key = "default_tab"
type = "select"
label_key = "settings.default_tab.label"
description_key = "settings.default_tab.description"
default = "notes"
options = [
  { value = "notes", label_key = "settings.tab.notes" },
  { value = "tools", label_key = "settings.tab.tools" },
  { value = "hotspot", label_key = "settings.tab.hotspot" },
  { value = "windows", label_key = "settings.tab.windows" },
]
visible_when = { key = "remember_last_tab", values = ["false"] }

[[setting]]
key = "timer_default_minutes"
type = "int"
label_key = "settings.timer_default_minutes.label"
description_key = "settings.timer_default_minutes.description"
default = 25
min = 1
max = 5999

[[setting]]
key = "timer_presets"
type = "string_list"
label_key = "settings.timer_presets.label"
description_key = "settings.timer_presets.description"
default = ["5", "15", "25", "60"]

[[setting]]
key = "confirm_window_close"
type = "bool"
label_key = "settings.confirm_window_close.label"
description_key = "settings.confirm_window_close.description"
default = true

[[setting]]
key = "hotspot_default_ssid"
type = "string"
label_key = "settings.hotspot_default_ssid.label"
description_key = "settings.hotspot_default_ssid.description"
default = ""

[[setting]]
key = "hotspot_default_band"
type = "select"
label_key = "settings.hotspot_default_band.label"
description_key = "settings.hotspot_default_band.description"
default = "bg"
options = [
  { value = "bg", label_key = "settings.band.bg" },
  { value = "a", label_key = "settings.band.a" },
]

[[setting]]
key = "system_refresh_seconds"
type = "int"
label_key = "settings.system_refresh_seconds.label"
description_key = "settings.system_refresh_seconds.description"
default = 3
min = 1
max = 30
advanced = true

[[panel]]
id = "sidebar"
entry = "panel.luau"
width = 1
height = 1
placement = "floating"
position = "center_left"
keyboard_focus = "none"
dismiss_on_outside_click = false

[[service]]
id = "backend"
entry = "service.luau"

[[widget]]
id = "toggle"
entry = "widget.luau"

[[shortcut]]
id = "open"
entry = "shortcut.luau"

# 「窗口」页的声明式 UI 原型（Noctalia 5.4 / plugin_api 42 起可用）：
# 与正式侧栏（id = sidebar，走 native GTK 前端）并存，用来对比 [[panel]] + ui.*
# 的观感与维护成本；入口：noctalia msg panel-open pang/tide-sidebar:windows-proto
[[panel]]
id = "windows-proto"
entry = "panel-windows.luau"
width = 420
height = "content"
max_height = 560
placement = "floating"
position = "center"

# 「工具」页的声明式原型：倒计时 / 秒表 / 热点，全部通过服务 IPC 操作（同一份状态）。
[[panel]]
id = "tools-proto"
entry = "panel-tools.luau"
width = 420
height = "content"
max_height = 620
placement = "floating"
position = "center"

# 「便签」页的声明式原型：列表 + 编辑器（ui.input multiline），数据与原生前端同源。
[[panel]]
id = "notes-proto"
entry = "panel-notes.luau"
width = 460
height = "content"
max_height = 620
placement = "floating"
position = "center"

# 统一侧栏：窗口 / 工具 / 便签三页。快捷键 Super+Shift+W 与状态栏按钮都指向这里。
[[panel]]
id = "side-panel"
entry = "panel-main.luau"
width = 460
height = 560
placement = "floating"
position = "center"
capture_keys = [ "escape", "ctrl+1", "ctrl+2", "ctrl+3" ]

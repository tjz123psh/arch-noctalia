id = "pang/sidebar"
name = "Sidebar · 随手工作台"
version = "2.4.2"
plugin_api = 32
author = "pang"
license = "MIT"
description = "轻量侧边工作台：新建便签、多行正文编辑、自动保存、待办勾选与 25 分钟任务专注；保留搜索、窗口、系统（含 Wi-Fi 热点开关）、最近文件及卡片整理。"
icon = "layout-sidebar-left"
tags = ["custom", "utility", "panel"]
dependencies = ["niri", "networkmanager", "libnotify", "xdg-utils", "glib2", "util-linux", "findutils", "python"]

# 设置分三段：便签 → 搜索/外观 → 热点（热点三项挨着放；频段属"设一次"的进阶项）。
# 面板相关的「panel · 显示模式/屏幕位置/层级」由宿主追加在本表之后，不在这里声明。

[[setting]]
key = "notes_dir"
type = "folder"
label_key = "settings.notes_dir.label"
description_key = "settings.notes_dir.description"
default = "~/Documents/notes"

[[setting]]
key = "search_limit"
type = "int"
label_key = "settings.search_limit.label"
description_key = "settings.search_limit.description"
default = 10
min = 3
max = 20

[[setting]]
key = "recent_count"
type = "int"
label_key = "settings.recent_count.label"
description_key = "settings.recent_count.description"
default = 8
min = 3
max = 15

[[setting]]
key = "motion"
type = "select"
label_key = "settings.motion.label"
description_key = "settings.motion.description"
default = "light"
options = [
  { value = "light", label_key = "settings.motion.light" },
  { value = "soft", label_key = "settings.motion.soft" },
  { value = "off", label_key = "settings.motion.off" },
]

[[setting]]
key = "hotspot_ssid"
type = "string"
label_key = "settings.hotspot_ssid.label"
description_key = "settings.hotspot_ssid.description"
default = ""

[[setting]]
key = "hotspot_password"
type = "string"
label_key = "settings.hotspot_password.label"
description_key = "settings.hotspot_password.description"
default = ""

[[setting]]
key = "hotspot_band"
type = "select"
label_key = "settings.hotspot_band.label"
description_key = "settings.hotspot_band.description"
default = "bg"
advanced = true
options = [
  { value = "bg", label_key = "settings.hotspot_band.bg" },
  { value = "a", label_key = "settings.hotspot_band.a" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = "fill"
placement = "floating"
position = "center_left"
keyboard_focus = "exclusive"
# 全局捕获不能按输入焦点放行，普通方向键必须留给输入框。
capture_keys = ["Alt+Up", "Alt+Down"]

# 常用操作说明写在 mpv.conf 顶部（按 ? 也能随时查看全部键位）

# 倍速播放
[ add speed -0.1
] add speed 0.1
{ add speed -0.5
} add speed 0.5
BS set speed 1.0

# 常用播放控制
SPACE cycle pause
f cycle fullscreen
o show-progress
m cycle mute
q quit-watch-later
Q quit

# 跳转
LEFT seek -5
RIGHT seek 5
Shift+LEFT seek -30
Shift+RIGHT seek 30

# 音量调节（替代 mpv.conf 中已失效的 volume-step）
UP add volume 2
DOWN add volume -2
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# ── uosc 界面：右键菜单 / 键位速查 / 各功能面板 ──
MBTN_RIGHT script-binding uosc/menu            # 右键 = 菜单
?          script-binding uosc/keybinds        # ? = 看当前所有键位
Ctrl+o     script-binding uosc/open-file       # 打开文件 / URL
Ctrl+l     script-binding uosc/load-subtitles  # 加载外挂字幕
Ctrl+j     script-binding uosc/subtitles       # 字幕轨
Ctrl+a     script-binding uosc/audio           # 音轨
Ctrl+v     script-binding uosc/video           # 视频轨
Ctrl+p     script-binding uosc/playlist        # 播放列表
Ctrl+i     script-binding uosc/items           # 章节 + 播放列表
Ctrl+c     script-binding uosc/chapters        # 章节
Ctrl+q     script-binding uosc/stream-quality  # 网络流清晰度
Ctrl+d     script-binding uosc/audio-device    # 音频输出设备
Ctrl+t     script-binding uosc/toggle-ui       # 临时隐藏界面
Alt+f      script-binding uosc/show-in-directory # 在文件管理器里定位

# ── 顺手加的 ──
# ── Anime4K 画质超分（AUR 包 anime4k-git；按上游约定：Ctrl+1/2/3 = 模式 A/B/C，Ctrl+0 = 关闭）──
# 默认关闭：只有需要时才开（开了会明显吃 GPU/电）。Ctrl+1 = 1080p 动画，Ctrl+2 = 720p 动画，Ctrl+3 = 480p 老番
Ctrl+1 no-osd set glsl-shaders "/usr/share/anime4k/Restore/Anime4K_Clamp_Highlights.glsl:/usr/share/anime4k/Restore/Anime4K_Restore_CNN_VL.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_VL.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x2.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x4.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_M.glsl" ; show-text "Anime4K：模式 A（1080p 动画）" 2000
Ctrl+2 no-osd set glsl-shaders "/usr/share/anime4k/Restore/Anime4K_Clamp_Highlights.glsl:/usr/share/anime4k/Restore/Anime4K_Restore_CNN_M.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_M.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x2.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x4.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_S.glsl" ; show-text "Anime4K：模式 B（720p 动画）" 2000
Ctrl+3 no-osd set glsl-shaders "/usr/share/anime4k/Restore/Anime4K_Clamp_Highlights.glsl:/usr/share/anime4k/Restore/Anime4K_Restore_CNN_Soft_S.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_S.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x2.glsl:/usr/share/anime4k/Upscale/Anime4K_AutoDownscalePre_x4.glsl:/usr/share/anime4k/Upscale/Anime4K_Upscale_CNN_x2_S.glsl" ; show-text "Anime4K：模式 C（480p 老番）" 2000
Ctrl+0 no-osd set glsl-shaders "" ; show-text "Anime4K：已关闭" 1500

Alt+UP     add volume 5
Alt+DOWN   add volume -5
Ctrl+r     set speed 1.0

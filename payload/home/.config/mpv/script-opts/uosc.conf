# ── uosc 主题与交互（arch-noctalia 安装器种子；uosc 本体来自 AUR 包 mpv-uosc）──
# 首次安装写入；之后你在机器上的改动不会被安装器覆盖（见 manifests/seed.tsv）
# 配色取自本机 Noctalia 调色板：底 #101418 / 前景 #e1e2e8 / 强调 #9fcafc / 次强调 #d6bee5

# ── 外观：圆角 + 半透明（液态玻璃观感）──
border_radius=10
color=foreground=e1e2e8,foreground_text=101418,background=101418,background_text=9fcafc,window_border=9fcafc,success=a5e075,error=ffb4ab,match=9fcafc,heatmap=9fcafc
opacity=timeline=0.8,position=1,chapters=0.7,slider=0.9,slider_gauge=1,controls=0.55,speed=0.6,menu=0.88,submenu=0.65,border=0.9,title=1,tooltip=0.88,thumbnail=1,curtain=0.6
text_border=1.2
font_scale=1

# ── 顶栏常显：文件名 + 时间 + 窗口按钮（never / no-border / always）──
top_bar=always
top_bar_size=40

# ── 控件条：uosc 默认那套（菜单/字幕/音轨/清晰度/速度/循环/上一下一/列表/全屏），暂停时常驻 ──
controls_persistency=paused
timeline_persistency=paused

# ── 时间轴：细线 + 缓冲指示 + 章节刻度 + 悬停缩略图（thumbfast 自动接线）──
timeline_style=line
timeline_line_width=2
timeline_size=40
timeline_cache=yes
timeline_heatmap=overlay
timeline_step=5
progress=windowed
progress_size=2

# ── 菜单：打开后直接打字搜索（易用）──
menu_type_to_search=yes
menu_item_height=36
menu_min_width=260

# ── 反馈：暂停时闪一下播放图标 ──
pause_indicator=flash

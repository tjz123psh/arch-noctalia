# ═══ mpv 常用操作（完整键位按 ? 查看，可打字搜索）═══
#  右键 ……… 功能菜单（字幕 / 音轨 / 清晰度 / 播放列表 / 章节 / 退出）
#  SPACE …… 播放/暂停        f …… 全屏              q …… 退出（记住进度）
#  ← → ……… 快退/快进 5 秒    Shift+← → …… 30 秒    ↑ ↓ …… 音量
#  [ ] ……… 减速/加速        BS …… 速度复位 1.0     m …… 静音
#  s ……… 截图到 ~/Pictures  o …… 显示进度条        ? …… 全部键位
#  Ctrl+o …… 打开文件/URL    Ctrl+l …… 挂外挂字幕    Ctrl+j / a / v …… 字幕 / 音轨 / 视频轨
#  Ctrl+p …… 播放列表        Ctrl+i / c …… 章节      Ctrl+q …… 清晰度    Ctrl+t …… 隐藏界面
# ── 进阶 ──
#  B 站链接：弹幕自动出现（v 开关）；本地片没字幕时按 a 联网搜字幕（assrt）
#  Anime4K 画质超分：Ctrl+1 / 2 / 3 = 1080p / 720p / 480p 动画，Ctrl+0 关闭（默认关，开了吃 GPU）
#  ⚠ mpv 的 [名字] 段是 profile：全局设置必须写在第一个 [ 之前（本文件已如此，往下面加设置时注意）
# 默认音量 50，最大 150
volume=50
volume-max=200

# 不自动关闭（播完停在最后一帧，适合合集模式）
keep-open=yes

# 记住播放进度
save-position-on-quit=yes

# 流媒体缓存（对 B 站这种远程源有用）
cache=yes
cache-secs=300


# 截图保存到 Pictures
screenshot-directory=~/Pictures

# OSD
osd-level=1
osd-font-size=28
osd-bar=yes                 # 显示进度/音量/速度条

# 硬件解码（B 站 1080p 省 CPU）
hwdec=auto
video-sync=display-resample
interpolation=yes

# GPU 高质量缩放（画质更细腻，略吃性能）
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# 强制选择 1080p（或可用的最高画质）
ytdl-format=bestvideo[height<=1080][ext=mp4]+bestaudio[ext=m4a]/best[height<=1080]

# 无边框（浮动窗更干净）
border=no

# 自动加载同名字幕
sub-auto=all

# 鼠标隐藏延迟（毫秒）
cursor-autohide=1000

# 关闭屏保
stop-screensaver=yes

# ── 字幕 / OSD 样式 ──
osd-font=Noto Sans CJK SC
sub-font=Noto Sans CJK SC
sub-font-size=44
sub-border-size=2.2
sub-shadow-offset=1
sub-margin-y=28

# ── 画质微调（B 站这种低码率片源受益）──
deband=yes
deband-iterations=2
deband-threshold=48
correct-downscaling=yes
dither-depth=auto

# ── UI：uosc（AUR 包 mpv-uosc）+ thumbfast（AUR 包 mpv-thumbfast-git）──
# uosc 本体装在 /usr/share/mpv/scripts，而 mpv 默认只扫 ~/.config/mpv/scripts 与 /etc/mpv/scripts，故显式加载
script=/usr/share/mpv/scripts/uosc
# uosc 的图标字体在 /usr/share/mpv/fonts，mpv 默认不扫这个目录；缺了图标字体会让控件排版挤成一团（这行必须留）
osd-fonts-dir=/usr/share/mpv/fonts
sub-fonts-dir=/usr/share/mpv/fonts
# thumbfast（缩略图）在 /etc/mpv/scripts，会被自动加载，由 uosc 自动接线

# B 站弹窗播放配置（~/.local/bin/b23 使用，实际脚本在 ~/scripts/media/b23）
[b23]
profile-desc=Bilibili popup player
geometry=640x360
force-window=immediate
ontop=yes
title=正在加载 B 站视频...
# 不等待缓存填满，窗口弹出即播放；缓存放小避免等太久
cache-pause=no
cache-secs=10

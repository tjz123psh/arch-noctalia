# fuzzel — 启动器（Mod+D）
# 第一行 include 由 Noctalia 社区模板维护（templates-apply 会更新）；
# 下面的 [main]/[border] 是 rice 参数，模板更新不会动它们。
include=/home/pang/.config/fuzzel/themes/noctalia

[main]
font=Maple Mono NF CN:size=11
icon-theme=Papirus-Dark
terminal=kitty
prompt=" "
placeholder="搜索应用…"
lines=12
width=32
horizontal-pad=28
vertical-pad=16
inner-pad=8

[border]
width=1
radius=14

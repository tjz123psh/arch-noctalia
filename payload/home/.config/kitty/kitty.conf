# ══════════════════════════════════════════════════════════════
#  kitty — 主题色由 Noctalia 从壁纸生成（Material You）
#  themes/noctalia.conf 由 `noctalia msg templates-apply` 写入
# ══════════════════════════════════════════════════════════════
include themes/noctalia.conf

# ── 字体：等宽用 Maple Mono NF CN（自带中文 + Nerd 图标，不用拼回退链）
font_family      Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# ── 光标
cursor_shape       beam
cursor_trail       2
cursor_trail_decay 0.1 0.4

# ── 留白与透明度（毛玻璃由 niri 的 window-rule background-effect 负责）
window_padding_width 16
background_opacity   0.78
dynamic_background_opacity yes

# ── 去掉窗口边框（圆角由 niri 的 geometry-corner-radius 负责）
window_border_width 0
draw_minimal_borders no

# ── 滚动条：常显、可拖拽、点击跳转（与物理机一致）
scrollbar always
# 鼠标可拖拽滚动条
scrollbar_interactive yes
# 点击轨道直接跳转到对应位置
scrollbar_jump_on_click yes
# 滚动条宽度（单元格宽度倍数）
scrollbar_width 0.6
# 滑块不透明度
scrollbar_handle_opacity 0.6
# 轨道不透明度
scrollbar_track_opacity 0.15
# 滑块圆角
scrollbar_radius 0.4
# 滚动条与窗口边缘间距
scrollbar_gap 0.15

# ── 标签栏：圆润 powerline，和整体风格一致
tab_bar_edge       top
tab_bar_style      powerline
tab_powerline_style round
tab_title_template "{index}: {title}"

# ── 杂项
shell                   /usr/bin/fish
scrollback_lines        30000
confirm_os_window_close 0
enable_audio_bell       no
copy_on_select          yes
strip_trailing_spaces   smart
mouse_hide_wait         2.0

# ── 键位映射（与物理机一致）
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

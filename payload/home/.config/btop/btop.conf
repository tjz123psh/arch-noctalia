# btop — rice 配置（配色取自当前 Noctalia 色板；主题由 rice-btop-theme 生成）
color_theme = "noctalia"
theme_background = true
truecolor = true
rounded_corners = true

# ==== 布局：CPU / 内存 / 网络 / 进程 四象限 ====
shown_boxes = "cpu mem net proc"

# ==== 刷新与图形 ====
update_ms = 1000
graph_symbol = "braille"

# ==== GPU（NVIDIA）====
show_gpu = true

# ==== 电池（笔记本）====
show_battery = true

# ==== 温度 ====
check_temp = true
temp_scale = "celsius"

# ==== 网络 ====
net_auto = true
net_sync = true

# ==== 进程 ====
proc_sorting = "cpu lazy"
proc_tree = true

# ==== 键盘（vim 导航）====
vim_keys = true

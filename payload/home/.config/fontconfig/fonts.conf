<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/fonts.conf
  虚拟机二次元桌面 —— 统一字体体系（task-1 字体与图标体系）

  设计原则：圆润、统一、不回退成豆腐块。整条链只有一种风格取向（圆体几何无衬线）。

  链：界面(GSF, ROND=100) -> 中文(资源圆体) -> emoji(Noto Color Emoji) -> 图标(Material Symbols Rounded)
  等宽：Maple Mono NF CN（自带中文 + Nerd 图标，终端不需要再拼接）

  通用别名 "界面字体" / "UI Sans" / "system-ui" 直接可用。
  回滚：删掉本文件（或整段 <fontconfig>），再 fc-cache -f 即可恢复 Arch 默认。
-->
<fontconfig>

  <!-- =========================================================
       1. 一站式别名：界面字体
       ========================================================= -->
  <match target="pattern">
    <test name="family"><string>界面字体</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Google Sans Flex</string>
      <string>Resource Han Rounded CN</string>
      <string>Noto Color Emoji</string>
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>UI Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Google Sans Flex</string>
      <string>Resource Han Rounded CN</string>
      <string>Noto Color Emoji</string>
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>UI Font</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Google Sans Flex</string>
      <string>Resource Han Rounded CN</string>
      <string>Noto Color Emoji</string>
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Google Sans Flex</string>
      <string>Resource Han Rounded CN</string>
      <string>Noto Color Emoji</string>
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <!-- 常见写法 "Google Sans" 也指向 Flex -->
  <match target="pattern">
    <test name="family"><string>Google Sans</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>Google Sans Flex</string>
      <string>Resource Han Rounded CN</string>
      <string>Noto Color Emoji</string>
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <!-- =========================================================
       2. 通用族：sans-serif / system-ui
          fontconfig 按"逐字符覆盖"挑字，所以拉丁走 Google Sans Flex，
          汉字自动落到资源圆体，emoji 落到 Noto Color Emoji。
       ========================================================= -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Google Sans Flex</family>
      <family>Resource Han Rounded CN</family>
      <family>Noto Sans CJK SC</family>
      <family>Material Symbols Rounded</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- =========================================================
       3. 通用族：monospace —— Maple Mono NF CN（圆体、含中文与 Nerd 图标）
       ========================================================= -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Maple Mono NF CN</family>
      <family>CaskaydiaCove Nerd Font Mono</family>
      <family>CaskaydiaCove Nerd Font</family>
      <family>Cascadia Code</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- 衬线：中文别掉到豆腐块 -->
  <alias binding="weak">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- =========================================================
       4. 图标：任何请求 "Material Symbols" 的都拿到 Rounded
          （上游包同时提供 Outlined / Rounded / Sharp，这里统一到圆角）
       ========================================================= -->
  <match target="pattern">
    <test name="family"><string>Material Symbols</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Material Icons</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Material Symbols Rounded</string>
    </edit>
  </match>

  <!-- 图标字重/大小轴保持默认（FILL=0 线性圆角、wght=400），需要填充式图标时
       由应用侧设置 font-variation-settings: 'FILL' 1 即可。 -->

  <!-- =========================================================
       5. 名字兼容：Cascadia / Nerd Font 的实际族名是 CaskaydiaCove
       ========================================================= -->
  <match target="pattern">
    <test name="family"><string>Cascadia Code NF</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>CaskaydiaCove Nerd Font</string>
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Cascadia Code</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>CaskaydiaCove Nerd Font</string>
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Cascadia Mono</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>CaskaydiaCove Nerd Font Mono</string>
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Cascadia Code NFM</string></test>
    <edit name="family" mode="assign" binding="strong">
      <string>CaskaydiaCove Nerd Font Mono</string>
      <string>Maple Mono NF CN</string>
    </edit>
  </match>

  <!-- =========================================================
       6. 渲染参数（想让系统默认渲染就整段删掉）
          灰度抗锯齿 + hintslight + 关闭内嵌点阵：
          在 VMware 缩放下不会有彩色描边，中文小字也不发虚。
       ========================================================= -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

</fontconfig>

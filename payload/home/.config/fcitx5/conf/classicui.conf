# fcitx5 经典界面（候选窗）——与桌面主题联动
# 说明：Noctalia 会把当前配色写到 ~/.local/share/fcitx5/themes/noctalia/theme.conf，
# 这里只负责“选中它 + 字体与交互”；主题文件本身由 Noctalia 每次换壁纸时重写，不要手改。
#
# 关键一条是 DarkTheme：系统处于深色模式（color-scheme=prefer-dark）时 fcitx5 用的是 DarkTheme，
# 出厂默认值 default-dark —— 只设 Theme=noctalia 不够，深色模式下会看不到 noctalia 主题。
# 两条路都指向 Noctalia 生成的主题，并跟随系统深浅模式（切浅色时自动用浅色版配色）。
Theme=noctalia
DarkTheme=noctalia
UseDarkTheme=False
UseSystemDarkTheme=True

# 字体与终端（kitty: Maple Mono NF CN 11.5）保持一致
Font=Maple Mono NF CN 12
MenuFont=Maple Mono NF CN 11
TrayFont=Maple Mono NF CN 10

# 交互
VerticalCandidateList=False
WheelForPaging=True
UsePerScreenDPI=True
EnableFractionalScale=True

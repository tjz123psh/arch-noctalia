[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    background_opacity = 0.0
    border = "primary"
    border_width = 1.0
    capsule = true
    capsule_border_width = 1.5
    capsule_fill = "on_secondary"
    capsule_opacity = 0.36999999172985554
    capsule_padding = 7.0
    capsule_thickness = 0.71999998763203621
    center = [ "datetime", "weather" ]
    concave_edge_corners = true
    contact_shadow = false
    enabled = true
    end = [ "group:sys", "group:status", "group:tools", "session" ]
    font_family = "Noto Serif Tibetan"
    font_scale = 1.0
    font_weight = 500
    hover_highlight = true
    layer = "top"
    margin_edge = 8
    margin_ends = 16
    margin_opposite_edge = 0
    padding = 12
    panel_overlap = 1
    radius = 24
    radius_bottom_left = 24
    radius_bottom_right = 24
    radius_top_left = 24
    radius_top_right = 24
    reserve_space = true
    scale = 1.0
    shadow = true
    show_on_workspace_switch = true
    smart_auto_hide = false
    start = [ "launcher", "workspaces", "active_window", "media" ]
    thickness = 36
    widget_spacing = 12

        [bar.default.dead_zone]

        [[bar.default.capsule_group]]

        id = "sys"
        members = [ "cpu", "ram", "disk" ]
        opacity = 0.36999999172985554
        padding = 8.0
        widget_spacing = 6

        [[bar.default.capsule_group]]
        fill = "on_secondary"
        id = "status"
        members = [ "tray", "network", "volume", "battery", "bluetooth" ]
        opacity = 0.36999999172985554
        padding = 8.0
        widget_spacing = 8

        [[bar.default.capsule_group]]
        fill = "on_secondary"
        id = "tools"
        members = [
            "privacy",
            "notifications",
            "clipboard",
            "screenshot",
            "screenrec",
            "color-picker",
            "mini-docker",
            "nightlight",
            "control-center"
        ]
        opacity = 0.36999999172985554
        padding = 8.0
        widget_spacing = 8


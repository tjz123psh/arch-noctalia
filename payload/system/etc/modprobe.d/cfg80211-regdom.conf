# 开机即把无线管制域设为 CN（中国）。
# 不设的话内核停在「世界域」(country 00)：5GHz 信道默认禁止主动发射 (no_ir=1)，
# 而 AP 模式必须主动发信标 → 5GHz 热点随机启动失败
# （wpa_supplicant: Failed to start AP functionality；NM: supplicant-timeout）。
# 依赖 wireless-regdb 提供 /lib/firmware/regulatory.db。
# 改完本文件要重载无线模块栈（或重启）才生效：已加载的 cfg80211 读不到新数据库。
options cfg80211 ieee80211_regdom=CN
